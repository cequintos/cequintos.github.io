<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scripts & Recursos | Carlos Quintos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/img/scripts.png">

    <meta name="description" content="Directorio de scripts, automatizaciones y utilidades de ingeniería de Carlos Quintos.">
    <meta name="author" content="Carlos Quintos">
    <meta property="og:title" content="Scripts & Recursos | Carlos Quintos">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/stars.js" defer></script>
</head>

<body>
    <a href="#main-content" class="skip-link">Salta al contenido principal</a>
    <canvas id="stars" aria-hidden="true"></canvas>

    <!-- Header dinámico -->
    <div id="header-placeholder"></div>

    <main id="main-content" class="container">
        <section class="hero">
            <h1 class="hero__title">Index of /scripts</h1>
            <p class="hero__subtitle">Automatización, Herramientas & Scripting</p>
            <p class="hero__description">
                Directorio público de scripts en Bash, PowerShell, Python y utilidades de automatización.
            </p>
        </section>

        <!-- Ventana estilo Terminal -->
        <section class="terminal-window" aria-label="Directorio de archivos y scripts">
            <div class="terminal-window__header">
                <div class="terminal-window__buttons">
                    <span class="btn btn--close"></span>
                    <span class="btn btn--minimize"></span>
                    <span class="btn btn--maximize"></span>
                </div>
                <span id="terminal-title" class="terminal-window__title">cequintos@sys:~/$ ls -la /downloads</span>
            </div>

            <div class="terminal-window__body">
                <div class="table-responsive">
                    <table class="file-table">
                        <thead>
                            <tr>
                                <th scope="col">Nombre</th>
                                <th scope="col">Última Modificación</th>
                                <th scope="col">Tamaño</th>
                                <th scope="col">Acción</th>
                            </tr>
                        </thead>
                        <!-- Se llena dinámicamente desde file-indexer.js -->
                        <tbody id="file-table-body"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer dinámico -->
    <div id="footer-placeholder"></div>

    <script src="assets/js/load-components.js" defer></script>
    <script src="assets/js/file-indexer.js" defer></script>
</body>

</html>
